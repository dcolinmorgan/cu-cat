name: CI Tests

on:

  #NOTE: All jobs gated by auth job

  #Regular dev
  push:
  pull_request:

  #Enable UI-driven branch testing
  workflow_dispatch:

  #Test main every sunday
  schedule:
    - cron: '0 0 * * 0'

jobs:


  test-core:

    runs-on: ubuntu-latest

    strategy:
      matrix:

        python-version: ['3.10', '3.11', '3.12', '3.13']


    steps:

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Checkout LFS objects
      run: git lfs pull

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m venv cu_cat
        source cu_cat/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -e .[test,dirty-cat]

    - name: Lint
      run: |
        source cu_cat/bin/activate
        ./bin/lint.sh

    - name: Type check
      run: |
        source cu_cat/bin/activate
        ./bin/typecheck.sh

    - name: Core tests
      run: |
        source cu_cat/bin/activate
        ./bin/test-core.sh


  test-rapids:

    needs: [ test-core ]

    # GitHub-hosted runners have no NVIDIA GPU, so this job only runs where one
    # actually exists. Register a self-hosted runner with the 'gpu' label, then
    # set the repository variable HAS_GPU_RUNNER=true to enable it. Until then
    # the job is skipped, which is visibly different from passing -- the
    # previous version ran on ubuntu-latest and gated every step on
    # `import cudf`, so it reported success without testing anything.
    if: ${{ vars.HAS_GPU_RUNNER == 'true' }}

    runs-on: [ self-hosted, gpu ]

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Checkout LFS objects
      run: git lfs pull

    - name: Show GPU
      run: nvidia-smi

    - name: Install test dependencies
      run: |
        python -m venv cu_cat
        source cu_cat/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -e .[test,rapids,dirty-cat]

    # Fail loudly: a missing RAPIDS stack on a GPU runner is a broken runner,
    # not a reason to report success.
    - name: Require RAPIDS
      run: |
        source cu_cat/bin/activate
        python -c "import cudf, cuml, cupy; print('cudf', cudf.__version__, 'cuml', cuml.__version__)"

    - name: Lint
      run: |
        source cu_cat/bin/activate
        ./bin/lint.sh

    - name: Type check
      run: |
        source cu_cat/bin/activate
        ./bin/typecheck.sh

    - name: RAPIDS tests
      run: |
        source cu_cat/bin/activate
        ./bin/test-rapids.sh

  test-build:

    needs: [ test-core ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Checkout LFS objects
      run: git lfs pull

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[build]

    - name: Test building
      run: |
        ./bin/build.sh


  test-docs:

    needs: [ test-core ]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Test building docs
      run: |
        echo "Doc build is disabled (needs the docs docker image); nothing was tested."
        # cd docs && ./docker.sh

  
